{%- comment -%}
  Chapter structured data for the HTML editions of the books. Outputs only on documents of a collection listed in _data/html_books.yml.
{%- endcomment -%}
{%- assign b = site.data.html_books[page.collection] -%}
{%- if b -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Chapter",
  "name": {{ page.heading | default: page.title | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "inLanguage": {{ b.lang | jsonify }},
  "author": { "@type": "Person", "@id": "https://turansert.com/#person", "name": "Turan Sert", "url": "https://turansert.com/" },
  "isPartOf": { "@type": "Book", "@id": {{ b.info_url | absolute_url | append: "#book" | jsonify }}, "name": {{ b.name | jsonify }}, "url": {{ b.info_url | absolute_url | jsonify }}{% if b.isbn != "" and b.isbn %}, "isbn": {{ b.isbn | jsonify }}{% endif %} },
  "position": {{ page.order | jsonify }},
{%- assign book_summary = site.data.book_summaries[page.url] -%}
{%- if book_summary %}
  "abstract": {{ book_summary | jsonify }},
  "description": {{ book_summary | jsonify }},
{%- endif %}
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page.url | absolute_url | jsonify }} },
  "isAccessibleForFree": true
}
</script>
{%- endif -%}
