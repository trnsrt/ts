# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Turan Sert - Kişisel Blog"
tagline: "Web3, blokzincir, DeFi ve yapay zeka üzerine yazılar"
email: 
description: >- # this means to ignore newlines until "baseurl:"
  Blokzincir, DeFi, Web3 ve yapay zeka gibi yeni nesil teknolojiler üzerine karalamalar
lang: tr
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://turansert.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: turansert
linkedin_username: turansert
instagram_username: turansert
youtube_username: UCh5_9-4LQUrJ-yF0plZ0fGg
nostr_npub: "npub1ylxn65y35hfqrs5c75hv4fnhvayq8p5f847ccsz8enj2nt2zc7eqedldd7"
logo: "/ts-bg-dark-v2_bant_v5.jpg"
author:
  name: Turan Sert
  url: https://turansert.com/about/
  twitter: turansert
twitter:
  username: turansert
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image: "/ts-bg-dark-v2_bant_v5.jpg"
  - scope:
      path: "assets/pdfjs"
    values:
      sitemap: false
  - scope:
      path: ""
      type: sorularla_web3
    values:
      # date = book publication date (stable datePublished); last_modified_at = dateModified and sitemap lastmod. Bump last_modified_at when the book pages change.
      # Noon UTC on purpose: GitHub Pages builds in UTC, and 00:00 +0300 would print as the previous day.
      date: 2025-01-15 12:00:00 +0000
      last_modified_at: 2026-11-27 12:00:00 +0000
      layout: book-section
      lang: tr
      seo:
        type: WebPage
  - scope:
      path: ""
      type: web3_unlocked
    values:
      date: 2026-02-15 12:00:00 +0000
      last_modified_at: 2026-11-27 12:00:00 +0000
      layout: book-section
      lang: en
      seo:
        type: WebPage
  - scope:
      path: ""
      type: sorularla_defi
    values:
      date: 2022-01-18 12:00:00 +0000
      last_modified_at: 2026-11-27 12:00:00 +0000
      layout: book-section
      lang: tr
      seo:
        type: WebPage
  - scope:
      path: ""
      type: sorularla_blockchain
    values:
      date: 2019-09-01 12:00:00 +0000
      last_modified_at: 2026-11-27 12:00:00 +0000
      layout: book-section
      lang: tr
      seo:
        type: WebPage
collections:
  sorularla_web3:
    output: true
  web3_unlocked:
    output: true
  sorularla_defi:
    output: true
  sorularla_blockchain:
    output: true
header_pages:
  - kitaplar.md
  - blockchain.md
  - defi.md
  - diger_web3.md
  - Etkinlikler.md
  - about.md
  - english.md
comments: false

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from



exclude:
  - tools
  - README.md
  - deneme.md
  - "NOTES-*.md"
  - "DECISIONS-*.md"
  - "REVIEW-*.md"
  - "*.docx"
  - "HANDOFF-*.md"
  - subscription-form.md
  - subscription-thank-you.md
