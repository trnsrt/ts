# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Turan Sert - Kişisel Blog"
email: 
description: >- # this means to ignore newlines until "baseurl:"
  Web3 olarak da adlandırılan, blokzincir üzerine kurulu merkeziyetsiz uygulamalar üzerine karalamalar
lang: tr
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://turansert.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: turansert
linkedin_username: turansert
instagram_username: turansert
youtube_username: UCh5_9-4LQUrJ-yF0plZ0fGg
logo: "/ts-bg-dark-v2_bant_v5.jpg"
twitter:
  username: turansert
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image: "/ts-bg-dark-v2_bant_v5.jpg"
header_pages:
  - kitaplar.md
  - blockchain.md
  - defi.md
  - diger_web3.md
  - Etkinlikler.md
  - about.md
  - english.md
comments: false

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from



# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

exclude:
  - README.md
  - deneme.md
  - NOTES-A.md
  - DECISIONS-A.md
  - subscription-form.md
  - subscription-thank-you.md
