---
layout: default
---
<article style="max-width:610px; margin:0 auto; padding:48px 24px;">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time> · <a class="post-author" rel="author" href="{% if page.lang == "en" %}/english/{% else %}/about/{% endif %}">Turan Sert</a></p>
  </header>

  <div class="post-content">
    {% include book-callout.html %}
    {{ content }}
  </div>

</article>
