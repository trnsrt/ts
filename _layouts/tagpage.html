---
layout: default
---
<div style="max-width:1000px; margin:0 auto; padding:48px 24px;">

  <header style="margin-bottom:40px; border-bottom:1px solid #e8e8e8; padding-bottom:24px;">
    <h1 style="font-family:-apple-system,sans-serif; font-size:36px; font-weight:700; color:#111; margin:0;">{{ page.tag }}</h1>
  </header>

  <div class="post-grid">
    {% for post in site.tags[page.tag] %}
      <div class="post-card">
        <a href="{{ post.url | relative_url }}" class="post-card-link">
          <div class="post-card-image">
            {% if post.image %}
            <img alt="" loading="{% if forloop.index <= 3 %}eager{% else %}lazy{% endif %}" decoding="async" src="{{ post.image }}" class="card-image">
            {% endif %}
          </div>
          <p class="post-card-date">{{ post.date | date: "%d.%m.%Y" }}</p>
          <h3 class="post-card-title">{{ post.title | escape }}</h3>
          <p class="post-card-excerpt">{{ post.excerpt | strip_html | truncatewords: 13 }}</p>
        </a>
      </div>
    {% endfor %}
  </div>

</div>
