# Short summaries shown under the H1 of pilot book pages (GEO batch B), keyed by page URL.
# Used by _layouts/book-section.html and _includes/chapter-jsonld.html. Kept outside the generated
# collection files so re-running tools/docx2book.py does not erase them.
"/Sorularla_DeFi/bolum-1/defi-ne-demek/": "DeFi (merkeziyetsiz finans), bankalar gibi mevcut finans aktörlerinin yapısını sorun olarak gören ve yerine kökten farklı bir sistem kurmaya çalışan bir hareket. Aracıların verdiği hizmeti dağıtık yapılara kaydırıyor: işlemleri merkezi bir kurum değil, akıllı kontrat denen küçük yazılımlar yürütüyor. Amaç, hizmeti veren ile alan arasındaki ilişkide gücü olabildiğince bireye vermek."
"/Sorularla_Web3/bolum-1/web3/": "Web 1.0, internetin ticari kaygılardan uzak, açık kaynak ve izin gerektirmeyen altyapı protokolleriyle kurulduğu ama kullanıcı dostu olmayan başlangıç dönemi. Web 2.0, kısaca internetin ticarileşmesi: kullanıcı dostu uygulamalar getirdi ama girişimleri daha merkezi, şirket yapısındaydı. Web3 ise blokzincir üzerinde, merkeziyetsizliği temel alarak Web 1.0’ın özgürlüğünü Web 2.0’ın kullanıcı kolaylığıyla birleştirmeyi hedefliyor."
"/Web3_Unlocked/chapter-1/web3/": "Web 1.0 was the age of protocols: open, permissionless standards like TCP/IP and HTTP that belonged to no one, but it was not user-friendly. Web 2.0 was the commercialization of the internet, bringing easy-to-use platforms built as closed, walled gardens. Web3’s philosophy is to combine Web 1.0’s decentralized freedom with Web 2.0’s user-friendly experience, built on the blockchain."
"/Sorularla_Web3/bolum-2/ethereumun-ekonomisi-nasil-calisiyor/": "ETH’nin para politikasında onaylayıcılara ödül olarak yeni ETH basılıyor; kullanıcıların ödediği işlem ücretlerinin bahşiş dışındaki kısmı ise yakılıyor. 2021’de yakımın başlaması ve 2022’de hisse kanıtına (Proof-of-Stake) geçişle ETH arzındaki artış BTC’nin çok altına indi, pek çok dönemde eksiye döndü. Bitcoin’e tahmin edilebilir ve azalan arzı nedeniyle “sağlıklı para” (sound money) dendiği için, topluluktan bir grup ETH’ye “ultra-sound money” diyor."
"/Web3_Unlocked/chapter-2/ethereum-economy/": "ETH has a dynamic monetary policy with no hard supply limit: validators are rewarded with newly issued ETH, while each transaction’s base fee is burned. Since late 2022 the burn has often kept pace with issuance, leaving supply stable or shrinking, so ETH was positioned as “ultra-sound money” beside Bitcoin’s “sound money”. Later fee-cutting upgrades made it slightly inflationary again."
"/Sorularla_Web3/bolum-2/moduler-ve-monoblok-cozumler/": "Blokzincir kayıt tutarken dört temel işlev yerine getiriyor: işlemi gerçekleştirme (execution), onaylama (consensus), kesinleştirme (settlement) ve sisteme duyurma (data publishing). Monoblok (monolitik) yapıda bunların hepsi tek elden yapılıyor, Apple ekosistemi gibi; modüler yapıda her işlevi farklı oyuncular üstleniyor, Android gibi. Bitcoin ve Solana monoblok yapıyı seçti; Ethereum üzerine kurulu ikinci seviye çözümler ise modüler yaklaşıma bir örnek."
"/Web3_Unlocked/chapter-2/modular-vs-monolithic/": "A blockchain must perform four jobs: execution, consensus, settlement and data availability. In the monolithic approach a single chain does all of them, like Apple’s integrated ecosystem; in the modular approach specialized layers handle each job, like Android. Bitcoin and Solana are monolithic, while Layer 2 rollups on Ethereum are an example of the modular approach."
"/Sorularla_Web3/bolum-4/ethena/": "Ethena, kullanıcının ETH, BTC, SOL gibi tokenleri kilitleyerek dolara 1:1 çıpalanmış USDe basmasını sağlayan ve kendini stabil para değil “sentetik dolar” olarak tanımlayan bir sistem. Teminatın fiyat düşüşünü merkezi borsalarda açtığı short pozisyonlarla dengeliyor. Başlıca riskleri: short pozisyonların uzun süre fonlama maliyeti ödeyerek zarar yazması, merkezi borsalara bağımlılık, akıllı kontrat ve oracle sorunları ile düzenleyici otoritelerin tutumu."
"/Web3_Unlocked/chapter-4/ethena/": "Ethena lets users deposit collateral such as ETH, BTC or SOL to mint USDe, which it calls a “synthetic dollar” designed to hold a 1:1 value with the dollar. It offsets collateral price moves with short positions on centralized exchanges. Its main risks are negative funding rates, exchange counterparty failure, smart contract bugs, oracle failures and regulation."
"/Web3_Unlocked/introduction/": "Web3 Unlocked is Turan Sert’s friendly question-and-answer guide to Web3 and the English edition of Sorularla Web3. It walks readers through the foundations, technologies, communities and applications of Web3, from the history of the web to tokenization and what comes next. The whole book is free to read here, chapter by chapter."
"/Sorularla_Web3/giris/": "Sorularla Web3, Turan Sert’in üçüncü kitabı ve Web3’ü soru-cevap biçiminde anlatan bir rehber; İngilizce baskısı Web3 Unlocked. Kitap, web’in tarihçesinden Web3 ekonomisinin yapı taşlarına, bu ekonominin aktörlerinden uygulama alanlarına ve tokenleştirmeye, oradan Web3’in geleceğine uzanıyor. Tamamı burada, bölüm bölüm ücretsiz okunabiliyor."
"/Sorularla_Web3/bolum-1/web-1-0/": "Web 1.0, internetin başlangıç dönemi: üniversite ve devlet destekli araştırmalarla, uzun vadeli bir bakışla kurulan altyapı protokollerinden oluşuyor. Bu protokoller açık kaynak ve ücretsiz, yapı ise dağıtık; ama uygulamalar kullanıcı dostu değil. Temelinde 1974’te geliştirilen TCP ve IP ile 1980’lerin sonunda ortaya çıkan www (HTML, HTTP, URL) yatıyor."
"/Web3_Unlocked/chapter-1/web-1-0/": "Web 1.0 was the early internet: a foundation of infrastructure protocols, built with a long-term view through university and government-funded research. The core protocols were open-source and free, and the network was distributed, but the applications were not user-friendly. Its base was TCP/IP, created in 1974, and the web’s HTML, HTTP and URL."
"/Sorularla_Web3/bolum-1/web-2-0/": "Web 2.0, kısaca internetin ticarileşmesi. 1990’ların başında ağın ticari işletmelere açılmasıyla başlayan bu süreçte girişim sermayesiyle büyüyen start-up’lar kullanıcı dostu uygulamalar geliştirdiler ama ürünlerini kapalı tuttular; zamanla az sayıda dev şirket öne çıktı. Bu şirketlerin reklam satışına ve kullanıcı verisine dayanan iş modeli ise sorunlara yol açtı."
"/Web3_Unlocked/chapter-1/web-2-0/": "Web 2.0 was the commercialization of the internet. Beginning in the early 1990s, venture-backed startups built user-friendly applications but kept them proprietary and closed, and the market consolidated into a handful of giants. Their ad-driven business model, built on user attention and data, created serious problems."
"/Sorularla_Web3/bolum-2/bitcoin-solana-ve-ethereum/": "Bitcoin, Solana ve Ethereum yatırımcılara farklı söylemler sunuyor. Bitcoin’in söylemi basit ve net bir “dijital altın”; Solana’nın ucuz ve hızlı işlemleri yeni kullanıcıları ve spekülasyon peşindekileri çekiyor; Ethereum ise merkeziyetsizlikten ödün vermeden altyapıya odaklandığı için küçük yatırımcıda karşılık bulmuyor, kurumsal yatırımcıda buluyor. 2023 sonunda ETH, BTC ve SOL’un gerisinde kaldı."
"/Web3_Unlocked/chapter-2/bitcoin-solana-ethereum/": "Bitcoin, Solana and Ethereum offer investors different narratives. Bitcoin’s is a simple “digital gold” story; Solana’s is very low fees and fast processing that draw newcomers and speculators; Ethereum limits block space to stay decentralized and focuses on secure infrastructure, which appeals more to institutions than to retail investors. In late 2023, ETH lagged BTC and SOL."
"/Sorularla_Web3/bolum-2/ikinci-seviye-cozumler/": "İkinci seviye çözümler (Layer 2), Ethereum üzerine kurulu ve Ethereum’un işlem gerçekleştirme (execution) yükünü üstlenen ayrı blokzincirler. Kullanıcıların işlemlerini toplu gerçekleştirip sonuçlarını Ethereum’a yazıyorlar; bu sayede ücretler düşüyor, kullanıcının parası da temelde Ethereum üzerinde kalıyor. Dezavantajı, her ek yazılımın yeni hata riski getirmesi."
"/Web3_Unlocked/chapter-2/layer-2-solutions/": "Layer 2 (L2) solutions are blockchains built on Ethereum that process transactions separately and post summaries back to it, raising throughput and cutting fees. Anchored to Ethereum, they keep user assets protected by its validators even if the L2 has a problem; L2s that publish their data elsewhere don’t get the same guarantee. They also carry their own software risk."
"/Sorularla_Web3/bolum-2/kopruler/": "Köprüler, kullanıcının bir blokzincirdeki dijital varlığını orada kilitleyip karşılığında başka bir ağda aynı değerde bir varlık sunan araçlar; yalnızca değer değil, her tür bilgiyi de aktarabiliyorlar. Blokzincirler birbirinden kopuk “adalar” gibi olduğu için, borsa üzerinden dört adımlı geçişe alternatif olarak kullanılıyorlar. Başlıca sıkıntıları akıllı kontrat hataları, merkezi yapı ve henüz sınırlı işlevsellik."
"/Web3_Unlocked/chapter-2/bridges/": "Bridges connect separate blockchains and let value and data move between them. Most use a lock-and-mint design: a token is locked on one chain and a wrapped version is issued on another. Their main weakness is security: early designs relied on a small group of trusted parties, and billions have been lost in hacks."
"/Sorularla_Web3/bolum-2/cuzdanlar/": "Dijital cüzdan, Web3 ve diğer merkeziyetsiz sistemlere ulaşmanın temel yolu olan, blokzincire erişim sağlayan bir uygulama. Ethereum dünyasındaki basit cüzdanlarda (EOA) tek bir özel anahtar var; 12 ya da 24 kelime ve cihaz birlikte kaybolursa varlıklar kurtarılamıyor. Akıllı kontrat cüzdanları (Account Abstraction) ise programlanabilir olduğu için çoklu anahtar, sosyal kurtarma ve çoklu imza gibi özellikler sunuyor."
"/Web3_Unlocked/chapter-2/wallets/": "A digital wallet is an app on a phone or computer that connects users to decentralized services. Older wallets relied on a 12-word seed phrase, and losing it meant losing the assets for good. Account Abstraction (ERC-4337) makes the wallet programmable software, enabling social recovery, layered security and spending limits."
"/Sorularla_Web3/bolum-2/intentler/": "Intent, kullanıcının işlemin adımlarını değil istediği sonucu belirttiği, aracıların bunu zincir dışında gerçekleştirip sonucu zincire kaydettiği araçlara verilen genel ad. Aracılar piyasayı tarayıp en uygun yolu buluyor; kullanıcının işlem öncesi parasını onlara emanet etmesi gerekmiyor. Uniswap X ve Across bu yaklaşımı kullanan örnekler."
"/Web3_Unlocked/chapter-2/intents/": "Intents let users declare the outcome they want, such as swapping 1 ETH for the most USDC possible, instead of managing each step. Competing agents called solvers find the best way to execute it, and assets stay in the user’s wallet until the deal is done. Across Protocol and Uniswap X are early examples."
"/Sorularla_Web3/bolum-2/celestia/": "Celestia, diğer blokzincirlere hizmet veren modüler bir altyapı zinciri: bir blokzincirin dört temel işlevinden yalnızca ikisini, işlemleri sıralamayı (uzlaşma/consensus) ve işlem yayınlamayı (data publishing) yapmaya aday. İşlem yayınlamayı Ethereum’a göre çok daha ucuza sunuyor ve birçok ikinci seviye ağ bunu kullanmaya başladı. En önemli rakipleri EigenDA ve Avail."
"/Sorularla_Web3/bolum-2/bitcoin-ikinci-seviye/": "Bitcoin üzerindeki ikinci seviye çözümler, Bitcoin’i yalnızca bir değer saklama aracı olmaktan çıkarıp üzerinde farklı işlemler yapılabilen bir ağa dönüştürmeyi amaçlıyor. Ancak Bitcoin, Ethereum’un aksine kendisine yazılan işlemlerin doğruluğunu kontrol etmediği için bu çözümler Bitcoin’in güvenliğinden tam olarak yararlanamıyor. Başlıca yaklaşımlar Lightning Network, Stacks gibi yan zincirler ve BitVM."
"/Sorularla_Web3/bolum-3/topluluk/": "Web3’te girişimi yalnızca kurucu ekip ve yatırımcılar değil; kullanıcılar, geliştiriciler ve madenciler/onaylayıcılar da büyütüyor, bu yüzden topluluk öne çıkıyor. Bu topluluklar, blokzincir üzerinde kurulup yönetilen organizasyonlar olan DAO’lar (Decentralized Autonomous Organization) içinde örgütleniyor ve katkılarının karşılığını girişimin çıkardığı tokenlerle alıyor. Tokenler, sahiplerine projenin yönü konusunda söz hakkı da veriyor."
"/Web3_Unlocked/chapter-3/community/": "In Web3 a startup is grown not only by its founders and investors but also by users, developers and miners or validators, which is why community comes first. These communities organize as DAOs (Decentralized Autonomous Organizations), governed by rules encoded on the blockchain, and are rewarded with the project’s tokens. Tokens also give holders a say in its direction."
"/Sorularla_Web3/bolum-3/kurucu-ekipler/": "Web3 kurucu ekipleri esnek ve birbirine gevşek bağlı bireylerden oluşuyor; çoğu birbirini hiç görmemiş, üyeler isterlerse anonim kalabiliyor. Projeler açık kaynak olduğu için güven ekibe değil, herkesin denetleyebildiği yazılıma dayanıyor. Açık kaynak ekipleri küçültüyor ve ürün çıkarmayı hızlandırıyor: Uniswap’ın 2021 Ocak’ta yaklaşık 3 milyar dolarlık piyasa değeriyle yalnızca 11 çalışanı vardı."
"/Web3_Unlocked/chapter-3/founders/": "Web3 founding teams are loosely connected individuals, many of whom have never met in person, and members may stay anonymous. Projects are open source, so users trust code anyone can audit, not the people. It keeps teams lean and launches fast: in its early days, Uniswap hit a multi-billion dollar market capitalization with a core team of just 11 people."
"/Sorularla_Web3/bolum-3/yatirimcilar/": "Web3’te girişim sermayelerinin eli, Web 2.0’daki meslektaşlarına göre daha zayıf: masada geliştiriciler ve kullanıcılar da var, hisse yerine token dağıtılıyor ve yatırımcının payı küçülüyor. Ancak zamanla yatırımcılar güçleniyor ve a16z’nin zk (zero-knowledge) araştırmalarında olduğu gibi büyük fonlar belirli alanlarda uzmanlaşıyor."
"/Web3_Unlocked/chapter-3/investors/": "In Web3 the venture capitalist’s hand is weaker than in the Web 2.0 era: developers, ecosystem partners and users all want a share of the value, tokens replace shares, and the VC’s slice gets smaller. But the pendulum is swinging back: investors are gaining strength and specializing, as a16z has in zero-knowledge research."
"/Sorularla_Web3/bolum-3/gelistiriciler/": "Electric Capital’ın 2024 Developer Report’una göre kripto alanındaki geliştirici sayısı 2015’ten beri yılda ortalama %39 artış gösterdi, ancak 2023 ve 2024’te azaldı; 2024’teki azalış yaklaşık %7. Buna karşın iki yıldan uzun süredir sektörde olan tecrübeli geliştiriciler arttı (%27) ve yazılan kodun %70’ini üretiyor. Ethereum geliştirici sayısında lider; büyük ağlar içinde en çok geliştirici çeken Solana."
"/Web3_Unlocked/chapter-3/developers/": "According to Electric Capital’s 2024 Developer Report, the number of crypto developers has grown 39% a year on average since 2015, with dips in 2023 and 2024 (about 7% in 2024). Seasoned developers (over two years in the space) grew 27% and write 70% of the code. Ethereum still leads in developers; Solana grew fastest among major networks."
"/Sorularla_Web3/bolum-3/madenciler-onaylayicilar/": "Madenciler ve onaylayıcılar, blokzincirin altyapısını çalıştıran makineler; Bitcoin ağında madenci, diğer ağlarda onaylayıcı deniyor. Sistemin sürekli ayakta kalması ve işlemlerin dürüst, bağımsız biçimde kaydedilmesi için bu makinelere ihtiyaç var. Karşılığında ağın yeni yarattığı tokenleri ödül olarak alıyorlar; Bitcoin madencilerinin ikinci gelir kalemi işlem ücretleri."
"/Web3_Unlocked/chapter-3/miners-validators/": "Miners and validators are the machines that run a blockchain’s infrastructure: miners on the Bitcoin network and validators on most others. They keep the system online and make sure transactions are recorded honestly and independently. In return they receive new tokens created by the network, and Bitcoin miners also earn transaction fees."
"/Sorularla_Web3/bolum-3/kullanicilar/": "Web3’ün kaç kişi tarafından kullanıldığını bilmek zor, çünkü kullanıcılar adreslerle işlem yapıyor ve anonim kalmayı tercih ediyor. Bugüne kadar kitle ağırlıkla erken dönem kullanıcılardan oluştu: teknolojinin felsefesine inananlar ile kazanç isteyenler (uzun vadeli yatırımcılar, spekülasyon yapanlar, airdrop peşindekiler). Daha fazla kullanıcıya ulaşmak için daha iyi kullanıcı deneyimi, yeni nesil cüzdanlar ve ürün-pazar uyumu gerekiyor."
"/Web3_Unlocked/chapter-3/users/": "It is nearly impossible to know how many people use Web3, because users are pseudonymous and transact through public addresses. So far they have been two groups of early adopters: pioneers drawn to decentralization and people seeking financial gain, such as investors, traders and airdrop hunters. To grow, Web3 needs a better user experience, new wallets and product-market fit."
"/Sorularla_Web3/bolum-4/stabil-paralar/": "Stabil paralar, değeri itibari bir para birimine bağlı olan paralar. Pazarın neredeyse tamamı ABD dolarına bağlı stabil paralardan oluşuyor; liderliği açık ara USDT (Tether) ve USDC alıyor. Bu merkezi stabil paralarda şeffaflık sorunları ve dondurulma riski var; merkeziyetsiz alternatif DAI ise yüksek teminat gerektirdiği için istediği büyüklüğe ulaşamıyor."
"/Web3_Unlocked/chapter-4/stablecoins/": "Stablecoins are cryptocurrencies pegged to a fiat currency, almost exclusively the US dollar in today's market. USDT (Tether) and USDC dominate; both are centralized, which requires trust in their reserves and lets Tether freeze assets remotely. DAI is a decentralized alternative, but it needs massive over-collateralization, which makes it capital-inefficient and has kept it from mass adoption."
"/Sorularla_Web3/bolum-4/merkeziyetsiz-finans-defi/": "DeFi (merkeziyetsiz finans), finans sektörünün sunduğu hemen her hizmetin merkeziyetsiz uygulamalarla blokzincir üzerinde verilmesi. Herkesin erişimine açık, şeffaf ve düşük maliyetli; kullanıcı hizmeti lego gibi parçalardan birleştirebiliyor ve varlıklarına tam sahip oluyor. Büyümesinin önündeki engeller kullanım zorluğu ile kullanıcıların aldığı riskler."
"/Web3_Unlocked/chapter-4/decentralized-finance/": "Decentralized finance (DeFi) is the rebuilding of the traditional financial system on blockchains: lending, borrowing, exchanging and derivatives become transparent, open-source protocols. It is open to anyone with a wallet and cheaper to run; users can snap services together like \"money legos\" and keep full control of their assets. Growth is held back by poor usability and user risk."
"/Sorularla_Web3/bolum-4/nft-dunyasi/": "NFT (Non-Fungible-Token), tekil (eşsiz) dijital varlık anlamına geliyor. Dijital ürünler kolayca kopyalanabildiği için sahiplik artık tek kopyaya sahip olmak değil, sahipliği blokzincire yazıp ilan etmek. NFT’ler orijinalliğin teyidini ve transferini ucuzlatıyor, geçmiş sahiplerin takibini mümkün kılıyor, sanatçıya sonraki satışlardan otomatik telif ödemesi sağlayabiliyor."
"/Web3_Unlocked/chapter-4/nft-universe/": "An NFT (Non-Fungible Token) is a small piece of code that acts as a unique digital certificate of authenticity for an asset. Because digital files can be copied endlessly, ownership rests on a public blockchain record of the original work. NFTs make provenance instant, transfer frictionless and creator royalties automatic, though royalties depend on marketplaces honoring them."
"/Sorularla_Web3/bolum-4/oyun-ve-metaverse/": "Web3 oyunları, oyunculara dijital varlıkları üzerinde tam kontrol veren ve bunları paraya çevirme imkanı tanıyan blokzincir temelli oyunlar. 2021-22’deki yatırımın ardından bu alandaki hype söndü: kalite yerine kazanca odaklanıldı, kullanıcı kazanımı zordu, token modelleri yanlıştı. Metaverse ise donanım gerektirdiği için Web3’ün diğer alanlarının gerisinde kaldı; ama bu başarısız olacağı anlamına gelmiyor, yalnızca başarı için gereken süre çok daha uzun."
"/Web3_Unlocked/chapter-4/gaming-metaverse/": "Web3 gaming uses blockchain, through NFTs, to give players true ownership of their in-game assets and a way to monetize their time. The first wave crashed because games prioritized earning over fun, onboarding was painful and many token models were inflationary. The metaverse is a harder, hardware-dependent problem: not a failed idea, but a marathon rather than a sprint."
"/Sorularla_Web3/bolum-4/merkeziyetsiz-sosyal-medya-desoc/": "Merkeziyetsiz sosyal medya (DeSoc), merkezi sosyal medya devlerinin sorunlarına, yani artan reklamlara, veri toplamaya, algoritmalara, sansüre ve platformsuzlaştırmaya çare olmaya çabalıyor. Temelinde kullanıcının içerik ve ilişkileri üzerinde tam sahipliği var; kullanıcılar içeriğe farklı uygulamalarla ulaşabiliyor. Öne çıkan altyapılar Lens Protocol, Farcaster ve Nostr. Alan henüz büyük medya devlerine kafa tutmaktan uzak."
"/Web3_Unlocked/chapter-4/decentralized-social-media/": "Decentralized Social (DeSoc) rebuilds social media so that users, not platforms, own their content, identity and network, stored on a permissionless, decentralized network that anyone can build apps on. It answers ad-driven business models, data collection, opaque algorithms, censorship and de-platforming. Lens Protocol, Farcaster and Nostr stand out, but DeSoc is still far from challenging the Web2 giants."
"/Sorularla_Web3/bolum-4/dijital-kimlik/": "Dijital kimlik, kullanıcıların dijital dünyada istedikleri gibi hareket etmesi için gereken temel araç. Bugünkü kimlikleri kamu otoriteleri, finansal kurumlar ve sosyal medya gibi merkezi kurumlar veriyor; bilgiler merkezi veritabanlarında tutuluyor, bu da güvenlik sorunu yaratıyor. Blokzincirle kullanıcı, işlemi yapanın kendisi olduğunu kişisel bilgi vermeden ya da çok kısıtlı bilgiyle kanıtlayabilecek."
"/Web3_Unlocked/chapter-4/digital-identity/": "Digital identity today is a set of separate identities issued by governments, banks and social media platforms and stored in central databases, which exposes them to hackers and to the exploitation of user data. Blockchain-based Self-Sovereign Identity (SSI) lets users hold credentials in their own wallet and prove facts about themselves without revealing the underlying personal data."
"/Sorularla_Web3/bolum-4/merkeziyetsiz-fiziksel-altyapilar-depin/": "DePIN (Decentralized Physical Infrastructure Network, Türkçesiyle Merkeziyetsiz Fiziksel Altyapı Ağları), merkezi kurumların egemenliğindeki altyapıyı merkeziyetsiz hale getirmeye çalışan bir hareket. Örnekleri Filecoin (veri depolama), Helium (Wi-Fi ve mobil telefon) ve Hivemapper (harita). Zorlukları donanım maliyeti, sürdürülebilir token modeli ve yeni kullanıcı çekmek; bu tür fiziki altyapı alanlarının gelişmesi için onlarca yıla ihtiyaç var."
"/Web3_Unlocked/chapter-4/physical-infrastructure/": "DePIN (Decentralized Physical Infrastructure Network) is a movement to rebuild physical infrastructure as a decentralized, user-owned alternative to services dominated by giant corporations, using token incentives to reward people who contribute hardware. Examples include Filecoin (storage), Helium (wireless) and Hivemapper (maps). Challenges include costly hardware, token economics and a cold-start problem, and rebuilding physical infrastructure takes decades."
"/Sorularla_Web3/bolum-4/onarici-finans-refi/": "Onarıcı finans (Regenerative Finance, ReFi), finansa yeni bir bakış açısı getirmeyi hedefleyen bir hareket. Amaç, doğayı ve çevreyi onararak toplumun refahını artırmak; değerin yalnızca kapital sahiplerine değil topluluklara ve çevreye de aktığı bir dünya kurmak. Blokzincirden yararlanıyor ve karbon kredileri ile sürdürülebilir tarım gibi alanlarda örnekleri var, ama kullanım alanları henüz konsept aşamasında."
"/Web3_Unlocked/chapter-4/regenerative-finance/": "Regenerative Finance (ReFi) is a movement aiming to reshape the financial landscape. Its goal is to restore the natural environment and boost societal well-being, with value flowing to communities and ecosystems, not only shareholders. It uses blockchain to fund this work; early projects tokenized carbon credits and financed sustainable farming, but the core idea is still unproven."
"/Sorularla_Web3/bolum-6/kisa-vade-beklentiler/": "2025–2026 için beklenti, Web3 altyapısının büyük ölçüde tamamlanması ve ilginin kullanıcıya dokunan uygulamalara kayması; temel başarı kriteri ‘ürün-pazar uyumu’ yakalamak. Diğer beklentiler arasında uygulamaların kullanıcıyı teknik ayrıntılarla muhatap etmemesi, kısa vadede düzenlemelerin dijital varlık saklama ve stabil paralara yoğunlaşması, ilk etkinin tamamen dijitalleşmiş sektörlerde görülmesi var."
"/Web3_Unlocked/chapter-6/short-term-expectations/": "2025–2026 is expected to bring a move from promise to product: Web3 infrastructure is maturing, the spotlight shifts to user-facing applications, and product-market fit becomes the measure of success. Expectations include apps that hide technical complexity from users, regulation focusing first on digital-asset custody and stablecoins, and the first major impacts coming in fully digital sectors."
"/Sorularla_Web3/bolum-6/uzun-vadede-neler-olabilir/": "Orta ve uzun vade beklentileri arasında 2026’ya gelindiğinde ağırlığın bireysel yatırımcılardan kurumsal yatırımcılara kayması, tokenleştirmenin fiziki ürünlere yayılması, altyapı uygulamalarının kuantum bilgisayarlara dayanıklı olacak şekilde güncellenmesi, 2028’den itibaren yapay zekanın öne çıkması ve 2030’da dünyada bir milyar Web3 hesabı olması var. Bir diğer beklenti, yapay zeka temsilcileri geliştikçe Web3’teki işlemlerin belki de yalnızca %10’unu insanların yapması, kalanını 7/24 çalışan yapay zeka temsilcilerinin gerçekleştirmesi."
"/Web3_Unlocked/chapter-6/long-term-outlook/": "Long-term expectations include the market’s center of gravity moving from individual enthusiasts to institutional capital by 2026, tokenization expanding from securities into the physical world, core infrastructure becoming quantum-resistant, AI dominating the conversation from 2028, and one billion Web3 users by 2030. Autonomous AI agents are expected to become Web3’s primary users, with humans initiating perhaps only 10% of transactions."
"/Sorularla_Web3/bolum-4/merkeziyetsiz-bilim-desci/": "Merkeziyetsiz bilim (DeSci), büyük kurum ve yayıncıların tekeli altına girmiş geleneksel bilimdeki oturmuş denklemi değiştirmeye çalışan bir Web3 kullanım alanı. Dört temel karakteristiğe dayanıyor: bilimi merkeziyetsiz sistemlere dağıtmak, şeffaflık, sınır ötesi ve sansüre dayanıklı ağlar ile DAO’lar ve tokenlerden oluşan bir teşvik sistemi. Alandaki oyuncular dokuz grupta toplanıyor; aralarında DAO’lar, yayıncılık, biyoteknoloji, fonlama ve veri saklama protokolleri var."
"/Web3_Unlocked/chapter-4/desci/": "Decentralized Science (DeSci) applies lessons from DeFi, especially the DAO model, to rebuild a scientific process monopolized by a handful of universities, grant agencies and publishers. It rests on four principles: decentralization, transparency, permissionless collaboration and new incentive systems built on DAOs, tokens and IP-NFTs. Its projects span new funding models, open publishing and collaboration, and data and IP infrastructure."
"/Sorularla_Web3/bolum-4/yapay-zeka-ve-web3/": "Blokzincir kesinlik gerektirirken yapay zeka olasılıklara dayandığı için iki teknoloji uyumlu değil, ama bazı alanlarda birbirini tamamlayabiliyor. Tamamen merkeziyetsiz bir yapay zeka modelinin teknoloji devleriyle yarışması mümkün görünmüyor; Web3 girişimleri veri, işlemci gücü, temsilci altyapısı ve son kullanıcı uygulamaları alanlarında belirli köşeleri tutmaya çalışıyor. Yapay zeka temsilcilerinin Web3’ün kullanım zorluğunu aşmasına yardımcı olabileceği öngörülüyor."
"/Web3_Unlocked/chapter-4/ai-meets-web3/": "Blockchain and AI are technically incompatible, since blockchain demands certainty while AI is probabilistic, yet they can complement each other where they intersect. A fully decentralized, end-to-end AI model cannot realistically compete with the tech giants, so Web3 startups carve out niches in data, compute, agent infrastructure and user applications. AI agents may help bridge Web3’s usability gap."
"/Sorularla_Web3/bolum-4/pyusd/": "PYUSD, PayPal’ın çıkardığı, değeri ABD Dolarına çıpalanmış bir stabil para; New York kanunlarına tabi bu paranın altyapı hizmetini Paxos veriyor. Karşılığı bir bankada tutuluyor, ama merkezi bir yapı tarafından basıldığı için cüzdandaki PYUSD uzaktan dondurulabiliyor. USDC ve USDT’den farkı, karşılığındaki dolarların şirket hesaplarından ayrı bir yediemin hesapta tutulması; bu yüzden basan kurumun iflas riskini taşımıyor."
"/Web3_Unlocked/chapter-4/pyusd/": "PYUSD is PayPal’s US dollar-pegged stablecoin, with infrastructure managed by Paxos under New York’s financial laws. It is backed by dollars in a bank, but because it is issued by a centralized company and fully programmable, the issuer can freeze coins even in personal wallets. Its key distinction is protection from issuer bankruptcy: reserves sit in a bankruptcy-remote trust account."
"/Sorularla_Web3/bolum-4/terra-ust/": "UST, Terra ekosisteminin temel parası LUNA’ya dayanan algoritmik bir stabil para. Anchor Protokolü’nün sunduğu %20 faizle piyasadaki UST miktarı 18 milyar ABD Dolarına ulaştı; Mayıs 2022’de FED’in açıklamaları sonrasında yoğun satış geldi ve UST dolar çıpasını kaybetti. Sürdürülemez yüksek faiz ve ataklara karşı alınan önlemlerin şeffaf olmaması güveni zedeledi; vaka, Web3’ün temel prensiplerinden sapıldığında neler olabileceğini gösterdi."
"/Web3_Unlocked/chapter-4/terra-implosion/": "UST was Terra’s algorithmic stablecoin, backed solely by its native cryptocurrency LUNA. Anchor Protocol’s 20% yield pushed its supply to $18 billion, but in May 2022, after US Federal Reserve announcements and a market decline, heavy selling broke its dollar peg irreversibly. Unsustainable yields and opaque defense measures eroded trust, showing the importance of adhering strictly to Web3 principles."
"/Sorularla_Web3/bolum-4/3ac-iflasi/": "Three Arrows Capital (3AC), 2012’de kurulan bir arbitraj fonu. BTC/GBTC, ETH/stETH ve USD/UST işlemlerini çok miktarda borçlanarak büyüttü. Mayıs 2022’de UST çıpasını kaybedince borç verenler kredileri geri çağırıp teminatları piyasada sattı; teminatların değeri düştü ve 3AC battı. Eylül 2023’te iki kurucuya 9 yıllık sermaye piyasası işlem yasağı getirildi."
"/Web3_Unlocked/chapter-4/3ac-bankruptcy/": "Three Arrows Capital (3AC), founded in 2012, was an arbitrage fund that amplified its GBTC, stETH and UST trades with heavy borrowing. When the UST peg broke in May 2022, lenders demanded repayment and sold the collateral, and 3AC collapsed. In September 2023, the Monetary Authority of Singapore banned both founders from its capital markets for nine years."
"/Sorularla_Web3/bolum-4/ftx-batisi/": "FTX, Kasım 2022’de altı günde çöktü. Binance’in sahibi CZ’nin elindeki FTT’leri satacağını duyurması FTT’nin fiyatının çakılmasına yol açtı; Binance FTX’i almaktan vazgeçti ve 11 Kasım’da FTX çatısındaki 134 kuruluş iflas koruması istedi. Bilinen temel gerçek, FTX’in müşteri fonlarını kardeş kuruluşu Alameda’ya kullandırmış olması. Temel sorun, bu merkezi yapıların birer kara kutu gibi çalışması."
"/Web3_Unlocked/chapter-4/ftx-collapse/": "FTX collapsed in six days in November 2022. After Binance’s CZ announced he would sell his FTT tokens, FTT crashed, Binance backed out of buying FTX, and all 134 FTX entities filed for bankruptcy on November 11. FTX had funneled customer funds to sister firm Alameda Research; CEO Sam Bankman-Fried was sentenced in March 2024 to 25 years in prison."
"/Sorularla_Web3/bolum-4/2023-abd-bankacilik-krizi/": "ABD’de 2023 başında Silvergate, Silicon Valley Bank ve Signature Bank kapandı. FED’in faizleri hızla artırması bankaların elindeki bonoların değerini düşürdü, müşteriler de paralarını çekmeye başladı; kripto ve teknoloji müşterilerine dayanan üç bankada etki daha sert oldu. Yetkililer mevduatlara sınırsız garanti getirdi. Sorun batık krediler değil, bono zararları ve risk yönetimindeki başarısızlık."
"/Web3_Unlocked/chapter-4/2023-us-banking-crisis/": "Silvergate, Signature and Silicon Valley Bank imploded in spring 2023. After rapid Fed rate hikes, banks’ bonds lost value and customers moved deposits to higher yields; the banks’ closely connected crypto and tech clients reacted instantly. Authorities guaranteed all deposits at the failed banks. The cause was a failure of basic risk management, not bad loans."
"/Sorularla_Web3/bolum-4/crypto-climate-coalition/": "Lemonade Crypto Climate Coalition (LCCC), Lemonade Foundation’ın kurduğu ve Mart 2022’de lansmanı yapılan bir DAO. Amacı, değişen iklim koşullarının geçimini çiftçilikle sağlayan yoksul insanlar üzerindeki etkisini azaltacak bir sigortacılık hizmeti sunmak. Sigortalı alanlara yağan yağmur bilgisi akıllı kontratlara aktarılacak; sel ya da kuraklıkta tazminat, çiftçinin başvurusuna gerek kalmadan otomatik olarak ödenecek."
"/Sorularla_Web3/bolum-4/vibe-dao/": "Vibe DAO (Vibe Bio), nadir hastalıkların çözümüne finansman sağlamayı hedefleyen, hastayı merkeze alan DAO benzeri bir yapı. Hastalar ve yakınları öneri sunuyor, uzmanlar değerlendiriyor, topluluk onaylıyor; finansmanın token ile sağlanması öngörülüyor, ama token konusunda hâlâ ilerleme yok. Haziran 2022’de kurulan girişim 12 milyon dolar yatırım aldı ve henüz yolun başında."
"/Sorularla_Web3/bolum-5/tokenler/": "Token, dijital dünyada başka herhangi bir dijital ya da fiziki varlığın sahipliğini gösteren varlık. Teknik olarak dijital sahipliği gösteren ufak bir kod parçacığı, yani akıllı kontrat; en önemli yanı programlanabilir olması. Başlıca üç standart, değiştirilebilir tokenler için ERC-20, tekil tokenler (NFT) için ERC-721 ve hibrit yapıdaki ERC-1155; coin ise token kavramının bir alt kümesi."
"/Web3_Unlocked/chapter-5/tokens/": "A token is a digital representation of ownership, from a piece of a company to a title to a house. Technically it is a small piece of code, a smart contract, and its key property is that it is programmable. Standards include fungible (ERC-20), non-fungible (ERC-721) and hybrid (ERC-1155) tokens; every coin is a type of token."
"/Sorularla_Web3/bolum-5/tokenomics/": "Tokenomics, ‘token’ ve ‘economics’ kelimelerinden türetilmiş bir terim; tokenlere bağlı bir ekonomi yaratılması ve bu ekonominin tasarlanması demek. Planlamada dört konuya dikkat etmek gerekiyor: token basımı, dağıtımı, dağıtım sonrası teşvikler ve token yakımı; bir diğer önemli konu zamanlama. Tokenlerin, kurucular ve yatırımcıların yanında madenci, geliştirici ve kullanıcılara da pay verecek biçimde kurgulanması gerekiyor."
"/Web3_Unlocked/chapter-5/tokenomics/": "Tokenomics, a mashup of ‘token’ and ‘economics’, is the art and science of designing an economy built on tokens. Its blueprint balances four elements: how tokens are created, distributed, used to keep everyone motivated and removed from circulation, with timing woven through all of them. The economy should reward every participant, including miners or validators, developers and users."
"/Sorularla_Web3/bolum-5/blackrock-token-hamlesi/": "BlackRock, Mart 2024’te Ethereum ağı üzerinde 100 milyon ABD Doları değerinde, BUIDL adlı tokenleştirilmiş bir fon çıkardı. Fonun hisseleri birer dolarlık tokenler halinde blokzincirde işleniyor, geliri her ay token sahiplerine ekstra token olarak gönderiliyor; fon ilk altı ayda 521 milyon dolara ulaştı. BUIDL, Bitcoin ETF’lerinin tersine, klasik dünyayı kriptoya yaklaştıran bir hamle."
"/Web3_Unlocked/chapter-5/blackrock-on-chain/": "BlackRock, the world’s largest asset manager, placed a $100 million tokenized money market fund called BUIDL on the Ethereum network in March 2024. Shares are represented by a dollar-pegged token, income is paid monthly as new tokens, and the fund swelled to $521 million in six months. Unlike a Bitcoin ETF, it pushes a traditional asset onto the blockchain."
"/Sorularla_Web3/bolum-5/abd-ev-tokenlestirmesi/": "2022’de South Carolina’daki iki katlı bir banliyö evi limited şirket (LLC) haline getirildi, şirketin sahipliği NFT’ye dönüştürülüp kriptopara ile satıldı. Toplam 175.000 USDC ödenen satışı USDC Homes finanse etti. Arada hâlâ pek çok aracı var ve KYC zorunlu; yine de işlem, tokenleştirmede önemli bir deney olarak görülebiliyor."
"/Web3_Unlocked/chapter-5/tokenizing-a-us-home/": "In 2022 a suburban house in South Carolina was sold on the blockchain: it was placed in an LLC, the LLC’s ownership became an NFT sold for cryptocurrency, and the buyer took a loan against the NFT. The sale price was 175,000 USDC, financed by USDC Homes. Many intermediaries and mandatory KYC show a long road ahead."
