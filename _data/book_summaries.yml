# Short summaries shown under the H1 of pilot book pages (GEO batch B), keyed by page URL.
# Used by _layouts/book-section.html and _includes/chapter-jsonld.html. Kept outside the generated
# collection files so re-running tools/docx2book.py does not erase them.
"/Sorularla_DeFi/bolum-1/defi-ne-demek/": "DeFi (merkeziyetsiz finans), bankalar gibi mevcut finans aktörlerinin yapısını sorun olarak gören ve yerine kökten farklı bir sistem kurmaya çalışan bir hareket. Aracıların verdiği hizmeti dağıtık yapılara kaydırıyor: işlemleri merkezi bir kurum değil, akıllı kontrat denen küçük yazılımlar yürütüyor. Amaç, hizmeti veren ile alan arasındaki ilişkide gücü olabildiğince bireye vermek."
"/Sorularla_Web3/bolum-1/web3/": "Web 1.0, internetin ticari kaygılardan uzak, açık kaynak ve izin gerektirmeyen altyapı protokolleriyle kurulduğu ama kullanıcı dostu olmayan başlangıç dönemi. Web 2.0, kısaca internetin ticarileşmesi: kullanıcı dostu uygulamalar getirdi ama girişimleri daha merkezi, şirket yapısındaydı. Web3 ise blokzincir üzerinde, merkeziyetsizliği temel alarak Web 1.0’ın özgürlüğünü Web 2.0’ın kullanıcı kolaylığıyla birleştirmeyi hedefliyor."
"/Web3_Unlocked/chapter-1/web3/": "Web 1.0 was the age of protocols: open, permissionless standards like TCP/IP and HTTP that belonged to no one, but it was not user-friendly. Web 2.0 was the commercialization of the internet, bringing easy-to-use platforms built as closed, walled gardens. Web3’s philosophy is to combine Web 1.0’s decentralized freedom with Web 2.0’s user-friendly experience, built on the blockchain."
"/Sorularla_Web3/bolum-2/ethereumun-ekonomisi-nasil-calisiyor/": "ETH’nin para politikasında onaylayıcılara ödül olarak yeni ETH basılıyor; kullanıcıların ödediği işlem ücretlerinin bahşiş dışındaki kısmı ise yakılıyor. 2021’de yakımın başlaması ve 2022’de hisse kanıtına (Proof-of-Stake) geçişle ETH arzındaki artış BTC’nin çok altına indi, pek çok dönemde eksiye döndü. Bitcoin’e tahmin edilebilir ve azalan arzı nedeniyle “sağlıklı para” (sound money) dendiği için, topluluktan bir grup ETH’ye “ultra-sound money” diyor."
"/Web3_Unlocked/chapter-2/ethereum-economy/": "ETH has a dynamic monetary policy with no hard supply limit: validators are rewarded with newly issued ETH, while each transaction’s base fee is burned. Since late 2022 the burn has often kept pace with issuance, leaving supply stable or shrinking, so ETH was positioned as “ultra-sound money” beside Bitcoin’s “sound money”. Later fee-cutting upgrades made it slightly inflationary again."
"/Sorularla_Web3/bolum-2/moduler-ve-monoblok-cozumler/": "Blokzincir kayıt tutarken dört temel işlev yerine getiriyor: işlemi gerçekleştirme (execution), onaylama (consensus), kesinleştirme (settlement) ve sisteme duyurma (data publishing). Monoblok (monolitik) yapıda bunların hepsi tek elden yapılıyor, Apple ekosistemi gibi; modüler yapıda her işlevi farklı oyuncular üstleniyor, Android gibi. Bitcoin ve Solana monoblok yapıyı seçti; Ethereum üzerine kurulu ikinci seviye çözümler ise modüler yaklaşıma bir örnek."
"/Web3_Unlocked/chapter-2/modular-vs-monolithic/": "A blockchain must perform four jobs: execution, consensus, settlement and data availability. In the monolithic approach a single chain does all of them, like Apple’s integrated ecosystem; in the modular approach specialized layers handle each job, like Android. Bitcoin and Solana are monolithic, while Layer 2 rollups on Ethereum are an example of the modular approach."
"/Sorularla_Web3/bolum-4/ethena/": "Ethena, kullanıcının ETH, BTC, SOL gibi tokenleri kilitleyerek dolara 1:1 çıpalanmış USDe basmasını sağlayan ve kendini stabil para değil “sentetik dolar” olarak tanımlayan bir sistem. Teminatın fiyat düşüşünü merkezi borsalarda açtığı short pozisyonlarla dengeliyor. Başlıca riskleri: short pozisyonların uzun süre fonlama maliyeti ödeyerek zarar yazması, merkezi borsalara bağımlılık, akıllı kontrat ve oracle sorunları ile düzenleyici otoritelerin tutumu."
"/Web3_Unlocked/chapter-4/ethena/": "Ethena lets users deposit collateral such as ETH, BTC or SOL to mint USDe, which it calls a “synthetic dollar” designed to hold a 1:1 value with the dollar. It offsets collateral price moves with short positions on centralized exchanges. Its main risks are negative funding rates, exchange counterparty failure, smart contract bugs, oracle failures and regulation."
"/Web3_Unlocked/introduction/": "Web3 Unlocked is Turan Sert’s friendly question-and-answer guide to Web3 and the English edition of Sorularla Web3. It walks readers through the foundations, technologies, communities and applications of Web3, from the history of the web to tokenization and what comes next. The whole book is free to read here, chapter by chapter."
"/Sorularla_Web3/giris/": "Sorularla Web3, Turan Sert’in üçüncü kitabı ve Web3’ü soru-cevap biçiminde anlatan bir rehber; İngilizce baskısı Web3 Unlocked. Kitap, web’in tarihçesinden Web3 ekonomisinin yapı taşlarına, bu ekonominin aktörlerinden uygulama alanlarına ve tokenleştirmeye, oradan Web3’in geleceğine uzanıyor. Tamamı burada, bölüm bölüm ücretsiz okunabiliyor."
"/Sorularla_Web3/bolum-1/web-1-0/": "Web 1.0, internetin başlangıç dönemi: üniversite ve devlet destekli araştırmalarla, uzun vadeli bir bakışla kurulan altyapı protokollerinden oluşuyor. Bu protokoller açık kaynak ve ücretsiz, yapı ise dağıtık; ama uygulamalar kullanıcı dostu değil. Temelinde 1974’te geliştirilen TCP ve IP ile 1980’lerin sonunda ortaya çıkan www (HTML, HTTP, URL) yatıyor."
"/Web3_Unlocked/chapter-1/web-1-0/": "Web 1.0 was the early internet: a foundation of infrastructure protocols, built with a long-term view through university and government-funded research. The core protocols were open-source and free, and the network was distributed, but the applications were not user-friendly. Its base was TCP/IP, created in 1974, and the web’s HTML, HTTP and URL."
"/Sorularla_Web3/bolum-1/web-2-0/": "Web 2.0, kısaca internetin ticarileşmesi. 1990’ların başında ağın ticari işletmelere açılmasıyla başlayan bu süreçte girişim sermayesiyle büyüyen start-up’lar kullanıcı dostu uygulamalar geliştirdiler ama ürünlerini kapalı tuttular; zamanla az sayıda dev şirket öne çıktı. Bu şirketlerin reklam satışına ve kullanıcı verisine dayanan iş modeli ise sorunlara yol açtı."
"/Web3_Unlocked/chapter-1/web-2-0/": "Web 2.0 was the commercialization of the internet. Beginning in the early 1990s, venture-backed startups built user-friendly applications but kept them proprietary and closed, and the market consolidated into a handful of giants. Their ad-driven business model, built on user attention and data, created serious problems."
"/Sorularla_Web3/bolum-2/bitcoin-solana-ve-ethereum/": "Bitcoin, Solana ve Ethereum yatırımcılara farklı söylemler sunuyor. Bitcoin’in söylemi basit ve net bir “dijital altın”; Solana’nın ucuz ve hızlı işlemleri yeni kullanıcıları ve spekülasyon peşindekileri çekiyor; Ethereum ise merkeziyetsizlikten ödün vermeden altyapıya odaklandığı için küçük yatırımcıda karşılık bulmuyor, kurumsal yatırımcıda buluyor. 2023 sonunda ETH, BTC ve SOL’un gerisinde kaldı."
"/Web3_Unlocked/chapter-2/bitcoin-solana-ethereum/": "Bitcoin, Solana and Ethereum offer investors different narratives. Bitcoin’s is a simple “digital gold” story; Solana’s is very low fees and fast processing that draw newcomers and speculators; Ethereum limits block space to stay decentralized and focuses on secure infrastructure, which appeals more to institutions than to retail investors. In late 2023, ETH lagged BTC and SOL."
"/Sorularla_Web3/bolum-2/ikinci-seviye-cozumler/": "İkinci seviye çözümler (Layer 2), Ethereum üzerine kurulu ve Ethereum’un işlem gerçekleştirme (execution) yükünü üstlenen ayrı blokzincirler. Kullanıcıların işlemlerini toplu gerçekleştirip sonuçlarını Ethereum’a yazıyorlar; bu sayede ücretler düşüyor, kullanıcının parası da temelde Ethereum üzerinde kalıyor. Dezavantajı, her ek yazılımın yeni hata riski getirmesi."
"/Web3_Unlocked/chapter-2/layer-2-solutions/": "Layer 2 (L2) solutions are blockchains built on Ethereum that process transactions separately and post summaries back to it, raising throughput and cutting fees. Anchored to Ethereum, they keep user assets protected by its validators even if the L2 has a problem; L2s that publish their data elsewhere don’t get the same guarantee. They also carry their own software risk."
"/Sorularla_Web3/bolum-2/kopruler/": "Köprüler, kullanıcının bir blokzincirdeki dijital varlığını orada kilitleyip karşılığında başka bir ağda aynı değerde bir varlık sunan araçlar; yalnızca değer değil, her tür bilgiyi de aktarabiliyorlar. Blokzincirler birbirinden kopuk “adalar” gibi olduğu için, borsa üzerinden dört adımlı geçişe alternatif olarak kullanılıyorlar. Başlıca sıkıntıları akıllı kontrat hataları, merkezi yapı ve henüz sınırlı işlevsellik."
"/Web3_Unlocked/chapter-2/bridges/": "Bridges connect separate blockchains and let value and data move between them. Most use a lock-and-mint design: a token is locked on one chain and a wrapped version is issued on another. Their main weakness is security: early designs relied on a small group of trusted parties, and billions have been lost in hacks."
"/Sorularla_Web3/bolum-2/cuzdanlar/": "Dijital cüzdan, Web3 ve diğer merkeziyetsiz sistemlere ulaşmanın temel yolu olan, blokzincire erişim sağlayan bir uygulama. Ethereum dünyasındaki basit cüzdanlarda (EOA) tek bir özel anahtar var; 12 ya da 24 kelime ve cihaz birlikte kaybolursa varlıklar kurtarılamıyor. Akıllı kontrat cüzdanları (Account Abstraction) ise programlanabilir olduğu için çoklu anahtar, sosyal kurtarma ve çoklu imza gibi özellikler sunuyor."
"/Web3_Unlocked/chapter-2/wallets/": "A digital wallet is an app on a phone or computer that connects users to decentralized services. Older wallets relied on a 12-word seed phrase, and losing it meant losing the assets for good. Account Abstraction (ERC-4337) makes the wallet programmable software, enabling social recovery, layered security and spending limits."
"/Sorularla_Web3/bolum-2/intentler/": "Intent, kullanıcının işlemin adımlarını değil istediği sonucu belirttiği, aracıların bunu zincir dışında gerçekleştirip sonucu zincire kaydettiği araçlara verilen genel ad. Aracılar piyasayı tarayıp en uygun yolu buluyor; kullanıcının işlem öncesi parasını onlara emanet etmesi gerekmiyor. Uniswap X ve Across bu yaklaşımı kullanan örnekler."
"/Web3_Unlocked/chapter-2/intents/": "Intents let users declare the outcome they want, such as swapping 1 ETH for the most USDC possible, instead of managing each step. Competing agents called solvers find the best way to execute it, and assets stay in the user’s wallet until the deal is done. Across Protocol and Uniswap X are early examples."
"/Sorularla_Web3/bolum-2/celestia/": "Celestia, diğer blokzincirlere hizmet veren modüler bir altyapı zinciri: bir blokzincirin dört temel işlevinden yalnızca ikisini, işlemleri sıralamayı (uzlaşma/consensus) ve işlem yayınlamayı (data publishing) yapmaya aday. İşlem yayınlamayı Ethereum’a göre çok daha ucuza sunuyor ve birçok ikinci seviye ağ bunu kullanmaya başladı. En önemli rakipleri EigenDA ve Avail."
"/Sorularla_Web3/bolum-2/bitcoin-ikinci-seviye/": "Bitcoin üzerindeki ikinci seviye çözümler, Bitcoin’i yalnızca bir değer saklama aracı olmaktan çıkarıp üzerinde farklı işlemler yapılabilen bir ağa dönüştürmeyi amaçlıyor. Ancak Bitcoin, Ethereum’un aksine kendisine yazılan işlemlerin doğruluğunu kontrol etmediği için bu çözümler Bitcoin’in güvenliğinden tam olarak yararlanamıyor. Başlıca yaklaşımlar Lightning Network, Stacks gibi yan zincirler ve BitVM."
